limit_req_zone $binary_remote_addr zone=pik_login:10m rate=10r/m;
server {
    listen 9443 ssl;
    server_name 65.109.182.47;
    ssl_certificate /etc/letsencrypt/live/65.109.182.47/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/65.109.182.47/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PIK:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=604800" always;
    location = /api/login {
        limit_req zone=pik_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
